name: Crawl islamweb dictionaries

on:
  schedule:
    # Every 6 hours. Cron is UTC.
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: "Time budget for this run, in minutes"
        required: false
        default: "320"

permissions:
  contents: write

# Don't let two crawls race on the same JSONL files; queue instead of cancelling
# so an in-progress run always gets to commit before the next one starts.
concurrency:
  group: crawl-dictionaries
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci
      - run: npm run build

      - name: Crawl all dictionaries (resumable, time-boxed)
        run: |
          node dist/cli.js crawl-all-dictionaries \
            --minutes="${{ github.event.inputs.minutes || '320' }}" \
            --concurrency=6 --delay=100

      - name: Commit and push any new data
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No new data this run."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          STAT="$(git diff --cached --stat | tail -n 1)"
          git commit -m "Automated islamweb dictionary crawl update" -m "$STAT"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Sync updated dictionaries to D1
        if: steps.commit.outputs.changed == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          for key in lisan-al-arab al-qamus-al-muhit al-nihaya-fi-gharib-al-hadith maqayis-al-lugha mukhtar-al-sihah; do
            node worker/scripts/import-via-api.mjs "$key"
          done
